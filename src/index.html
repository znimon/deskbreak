<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light dark" />
<title>DeskBreak — Movement Timer</title>

<!-- Applied before first paint so there's no flash of the wrong theme.
     Pico keys its own light/dark form-control colors off this same
     data-theme attribute, so setting it explicitly (rather than leaving
     Pico to auto-detect prefers-color-scheme on its own) is what keeps
     Pico's native checkbox/input colors and our own theme in sync. -->
<script>
  (function () {
    var stored = localStorage.getItem("deskbreak-theme");
    var theme = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>

<!-- Pico CSS, vendored locally (classless-friendly, styles plain native
     HTML elements — no shadow DOM, no custom-element internals to fight) -->
<link rel="stylesheet" href="styles/pico-main/css/pico.min.css" />

<!-- Phosphor Icons -->
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />

<link rel="stylesheet" href="styles/style.css" />
</head>
<body>

<button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle dark mode">
  <i class="ph ph-moon" aria-hidden="true"></i>
</button>

<main id="app">

  <section id="idle-screen" class="screen">
    <div class="theme-card start-card">
      <div class="start-card-header">
        <span class="start-brand">DeskBreak</span>
      </div>
      <h2 class="start-heading">Work Timer</h2>
      <p class="start-heading-sub">The Smart Way</p>
      <p id="start-date" class="start-date"></p>
      <button id="start-session-btn" class="btn-filled btn-large">
        Begin Session
        <i class="ph ph-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </section>

  <section id="running-screen" class="screen hidden">
    <div class="theme-card running-card">
      <div class="start-card-header">
        <span class="start-brand">DeskBreak</span>
      </div>
      <div class="timer-display">
        <div id="countdown-ring" class="countdown-ring">
          <div id="countdown" class="countdown">30:00</div>
        </div>
      </div>

      <dl class="stats">
        <div class="stat">
          <dt>Time elapsed</dt>
          <dd id="stat-elapsed">0:00</dd>
        </div>
        <div class="stat">
          <dt>Breaks completed</dt>
          <dd id="stat-completed">0</dd>
        </div>
        <div class="stat">
          <dt>Breaks skipped</dt>
          <dd id="stat-skipped">0</dd>
        </div>
        <div class="stat">
          <dt>Movement minutes</dt>
          <dd id="stat-movement-minutes">0</dd>
        </div>
      </dl>

      <div class="controls controls-vertical">
        <div class="control-row">
          <button id="pause-btn" class="btn-outlined">
            <i class="ph ph-pause" aria-hidden="true"></i>
            Pause
          </button>
          <button id="resume-btn" class="btn-outlined hidden">
            <i class="ph ph-play" aria-hidden="true"></i>
            Resume
          </button>
        </div>
        <div class="control-row">
          <button id="quick-break-3-btn" class="btn-filled break-btn">
            <i class="ph ph-person-simple-walk" aria-hidden="true"></i>
            3-min break
            <span id="quick-suggested-tag-3" class="suggested-inline hidden">Suggested</span>
          </button>
          <button id="quick-break-5-btn" class="btn-filled break-btn">
            <i class="ph ph-person-simple-walk" aria-hidden="true"></i>
            5-min break
            <span id="quick-suggested-tag-5" class="suggested-inline hidden">Suggested</span>
          </button>
        </div>
        <div class="control-row">
          <button id="end-session-btn" class="btn-outlined">
            <i class="ph ph-stop" aria-hidden="true"></i>
            End Session
          </button>
        </div>
      </div>
    </div>
  </section>

  <section id="ended-screen" class="screen hidden">
    <div class="theme-card">
      <div class="theme-card-header">
        <span class="start-brand">DeskBreak</span>
        <h2>Working Session Report</h2>
        <p id="summary-start-timestamp" class="summary-start-timestamp"></p>
      </div>
      <div class="theme-card-body">
        <dl class="stats">
          <div class="stat">
            <dt>Working session duration</dt>
            <dd id="summary-duration">0:00</dd>
          </div>
          <div class="stat">
            <dt>Breaks completed</dt>
            <dd id="summary-completed">0</dd>
          </div>
          <div class="stat">
            <dt>Breaks skipped</dt>
            <dd id="summary-skipped">0</dd>
          </div>
          <div class="stat">
            <dt>Movement minutes</dt>
            <dd id="summary-movement-minutes">0</dd>
          </div>
        </dl>
        <button id="restart-btn" class="btn-filled">
          Begin Session
          <i class="ph ph-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </section>

</main>

<dialog id="break-due-dialog">
  <article class="theme-card break-dialog">
    <h2>Time to move</h2>
    <div class="break-actions">
      <div class="control-row">
        <button id="start-break-3-btn" class="btn-filled break-btn">
          <i class="ph ph-person-simple-walk" aria-hidden="true"></i>
          3-min break
          <span id="suggested-tag-3" class="suggested-inline hidden">Suggested</span>
        </button>
        <button id="start-break-5-btn" class="btn-filled break-btn">
          <i class="ph ph-person-simple-walk" aria-hidden="true"></i>
          5-min break
          <span id="suggested-tag-5" class="suggested-inline hidden">Suggested</span>
        </button>
      </div>
      <div class="control-row">
        <button id="skip-break-btn" class="btn-outlined">
          Skip
        </button>
      </div>
    </div>
  </article>
</dialog>

<dialog id="break-active-dialog">
  <article class="theme-card break-dialog">
    <h2 id="break-active-title">Break</h2>
    <div id="break-countdown-ring" class="countdown-ring countdown-ring-small">
      <div id="break-countdown" class="countdown">5:00</div>
    </div>
    <div id="break-checklist" class="exercise-picker"></div>
    <div class="control-row">
      <button id="end-break-btn" class="btn-filled">
        <i class="ph ph-check" aria-hidden="true"></i>
        I'm done
      </button>
      <button id="cancel-break-btn" class="btn-outlined">
        Cancel
      </button>
    </div>
  </article>
</dialog>

<!--
  Dev-only panel. Gated behind DEV_PANEL_ENABLED in app.js — set that to
  false (or delete this block) before deploying to GitHub Pages.
-->
<aside id="dev-panel" class="side-panel side-panel-right">
  <p class="side-panel-title">Developer panel</p>
  <label>
    <input type="checkbox" id="dev-speed-toggle" role="switch" />
    Test speed (200x)
  </label>
</aside>

<script src="app.js"></script>
</body>
</html>
