# Which named bundles are available to offer for each break length. Each
# bundle is just a list of exercise ids (from the exercises list below) —
# add a new bundle by adding a new key and listing the ids it should
# contain. A bundle can list as many exercises as you want, and any
# exercise (including a walk) can appear in it — nothing is special-cased.
#
# Every bundle defined here is shown every time (scroll right to see more
# as you add bundles). One is always marked Suggested and shown first —
# whichever bundle comes right after the one used last time this break
# length was taken, cycling back to the first bundle after the last.
breaks:
  "3":
    bundles:
      3-bundle-1:
        - walk-3
        - squats
      3-bundle-2:
        - calf-raises
      3-bundle-3:
        - knee-raises
      3-bundle-4:
        - pushups
      3-bundle-5:
        - walkout-planks
      3-bundle-6:
        - thoracic-rotations
      3-bundle-7:
        - hip-flexor-stretch
      3-bundle-8:
        - wall-slides
  "5":
    bundles:
      5-bundle-1:
        - walk-5
        - squats
        - pushups
      5-bundle-2:
        - calf-raises
        - walkout-planks
      5-bundle-3:
        - knee-raises
        - thoracic-rotations
      5-bundle-4:
        - hip-flexor-stretch
        - wall-slides

# Exercise pool. Edit this list to add, remove, or change movements, then
# reference the id from a bundle above to include it in a break.
#
# category: "evidence" movements have direct randomized-trial support for
# interrupting sitting; "additional" movements are reasonable general
# strength/mobility choices but must not be presented as having the same
# level of evidence.
exercises:
  - id: walk-3
    name: Walk
    target: 3 mins
    category: evidence
    region: full-body
    type: cardio

  - id: walk-5
    name: Walk
    target: 5 mins
    category: evidence
    region: full-body
    type: cardio

  - id: squats
    name: Squats
    target: 8–12 reps
    category: evidence
    region: lower
    type: strength

  - id: calf-raises
    name: Calf raises
    target: 10–15 reps
    category: evidence
    region: lower
    type: strength

  - id: knee-raises
    name: Standing knee raises
    target: 10–20 alternating reps
    category: evidence
    region: lower
    type: strength

  - id: pushups
    name: Push-ups
    target: 5–10 reps
    category: additional
    region: upper
    type: strength

  - id: walkout-planks
    name: Walkout planks
    target: 3–5 reps
    category: additional
    region: core
    type: strength

  - id: thoracic-rotations
    name: Thoracic rotations
    target: 5 per side
    category: additional
    region: upper
    type: mobility

  - id: hip-flexor-stretch
    name: Hip-flexor stretch
    target: 20–30 sec per side
    category: additional
    region: lower
    type: mobility

  - id: wall-slides
    name: Wall slides
    target: 8–12 reps
    category: additional
    region: upper
    type: mobility
