# Which named bundles are available to offer for each break length.
# Each bundle is a list of exercise ids from the exercises list below.
#
# 3-minute breaks contain at most 2 exercises.
# 5-minute breaks contain 3 exercises.
#
# Every bundle defined here is shown every time. One is always marked
# Suggested and shown first, whichever bundle comes right after the one
# used last time for that break length, cycling back to the first bundle.

breaks:
  "3":
    bundles:
      3-circulation:
        - walk-2
        - squats

      3-upper-back:
        - thoracic-rotations
        - bench-t-spine-stretch

      3-lower-leg:
        - calf-raises
        - knee-raises

      3-strength:
        - pushups
        - squats

      3-hips-spine:
        - hip-flexor-stretch
        - thoracic-rotations

      3-core-shoulders:
        - walkouts
        - wall-slides

      3-lower-body:
        - runners-stretch
        - calf-raises

      3-hip-mobility:
        - hip-circles
        - hamstring-sweeps

      3-neck-upper-back:
        - neck-rotations
        - thoracic-rotations

      3-mobility:
        - runners-stretch
        - wall-slides

      3-posture:
        - wall-slides
        - thoracic-rotations

  "5":
    bundles:
      5-full-body:
        - walk-3
        - squats
        - pushups

      5-upper-body:
        - thoracic-rotations
        - bench-t-spine-stretch
        - wall-slides

      5-lower-body:
        - runners-stretch
        - reverse-lunges
        - calf-raises

      5-walk-mobility:
        - walk-3
        - hip-flexor-stretch
        - thoracic-rotations

      5-strength:
        - squats
        - pushups
        - wall-slides

      5-hip-mobility:
        - hip-circles
        - hamstring-sweeps
        - reverse-lunges

      5-walk-strength:
        - walk-3
        - calf-raises
        - pushups

      5-lower-reset:
        - hip-flexor-stretch
        - runners-stretch
        - squats

      5-core-upper:
        - walkouts
        - bench-t-spine-stretch
        - wall-slides

      5-mobility:
        - hip-circles
        - thoracic-rotations
        - neck-rotations

      5-posture:
        - wall-slides
        - bench-t-spine-stretch
        - neck-rotations


exercises:
  - id: walk-2
    name: Walk
    target: 2 mins
    category: evidence
    region: full-body
    type: cardio

  - id: walk-3
    name: Walk
    target: 3 mins
    category: evidence
    region: full-body
    type: cardio

  - id: squats
    name: Air Squats
    target: RPE 5
    category: evidence
    region: lower
    type: strength

  - id: calf-raises
    name: Calf Raises
    target: 15 reps
    category: evidence
    region: lower
    type: strength

  - id: knee-raises
    name: Knee Raises
    target: 10 per side
    category: evidence
    region: lower
    type: mobility

  - id: pushups
    name: Push-Ups
    target: RPE 5
    category: additional
    region: upper
    type: strength

  - id: walkouts
    name: Walkouts
    target: RPE 5
    category: additional
    region: core
    type: strength

  - id: reverse-lunges
    name: Reverse Lunges
    target: RPE 5
    category: additional
    region: lower
    type: strength

  - id: thoracic-rotations
    name: Thoracic Rotations
    target: 5 per side
    category: additional
    region: upper
    type: mobility

  - id: bench-t-spine-stretch
    name: Bench T-Spine Stretch
    target: 5 reps
    category: additional
    region: upper
    type: mobility

  - id: hip-flexor-stretch
    name: Hip Flexor Stretch
    target: 20 sec per side
    category: additional
    region: lower
    type: mobility

  - id: runners-stretch
    name: Runner's Stretch
    target: 20 sec per side
    category: additional
    region: lower
    type: mobility

  - id: hip-circles
    name: Hip Circles
    target: 5 per side
    category: additional
    region: lower
    type: mobility

  - id: hamstring-sweeps
    name: Hamstring Sweeps
    target: 5 per side
    category: additional
    region: lower
    type: mobility

  - id: wall-slides
    name: Wall Slides
    target: 10 reps
    category: additional
    region: upper
    type: mobility

  - id: neck-rotations
    name: Neck Rotations
    target: 5 per side
    category: additional
    region: upper
    type: mobility